<text x="70" y="145" fill="#FF8A24" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="6">DEVELOPER / PRODUCT BUILDER</text>
<text x="66" y="245" fill="url(#metal)" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="800" letter-spacing="-3">VINOD</text><text x="365" y="245" fill="#FF7A18" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="800" letter-spacing="-3">PATEL</text>
<text x="72" y="305" fill="#F3F4F6" font-family="Arial,Helvetica,sans-serif" font-size="27" letter-spacing="3">FULL STACK DEVELOPER  /  UI/UX ENTHUSIAST  /  CPO</text>
<text x="72" y="382" fill="#E5E7EB" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="600">I don't just write code.</text><text x="72" y="428" fill="#FF8A24" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800">I build systems.</text>
