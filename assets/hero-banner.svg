<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Vinod Patel — 3D Tech Universe</title><desc id="desc">Dark futuristic technology banner with a glowing orange three-dimensional sphere and orbital rings.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070B"/><stop offset=".55" stop-color="#11131A"/><stop offset="1" stop-color="#241006"/></linearGradient>
<radialGradient id="planet" cx="32%" cy="25%" r="75%"><stop stop-color="#FFF2D8"/><stop offset=".12" stop-color="#FFB45C"/><stop offset=".34" stop-color="#F36A12"/><stop offset=".68" stop-color="#7A270A"/><stop offset="1" stop-color="#140B0A"/></radialGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFCB7A" stop-opacity=".1"/><stop offset=".48" stop-color="#FF6A00"/><stop offset=".7" stop-color="#FFF0CF"/><stop offset="1" stop-color="#E84B00" stop-opacity=".2"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".5" stop-color="#B9C0CB"/><stop offset="1" stop-color="#636B78"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
